# 知识库的结构化元信息，由 `cargo xtask summary` 读取。
#
# 这里定义「有哪些分区」和「有哪些分类」，工具据此生成三类文件：
#   src/SUMMARY.md          侧边栏目录
#   src/<dir>/index.md      章节首页
#   src/<topic_index>.md    按主题分组的索引页
#
# 这三类文件都是**生成物，不要手工编辑**——改动会在下次构建时被覆盖。
# 唯一的例外是 SUMMARY.md 中的条目顺序：工具会原样保留，
# 想调整章节次序就直接改 SUMMARY.md，新增条目则自动追加到分区末尾。

# ---------------------------------------------------------------- 分区
#
# dir    src/ 下的目录名
# part   侧边栏中的 `# Part` 标题
# title  章节首页的 H1，同时作为侧边栏中指向首页的条目文字
# intro  章节首页的导语，可省略

[[section]]
dir = "english"
part = "English"
title = "English"

[[section]]
dir = "philosophy"
part = "Philosophy"
title = "Philosophy"
intro = "《西方哲学史》阅读笔记，按哲学史时间线组织。"

[[section]]
dir = "rust"
part = "Rust"
title = "Rust"

[[section]]
dir = "clipping"
part = "Clipping"
title = "Clipping"

# ---------------------------------------------------------------- 主题索引
#
# 用于「一个知识点一个文件」的展开式章节：子目录里的每个文件用
# `<!-- topic: xxx -->` 声明自己属于哪一类，索引页按 topics 的顺序分组重建。
# 一个文件可以用逗号声明多个主题（`<!-- topic: 倒装结构, 从句结构 -->`），
# 会在每个相关分组下各出现一次，侧边栏里仍然只有一条。
#
# index   索引页路径，必须与 dir 同名（工具靠这个约定把子条目挂到父页下）
# dir     子文件所在目录
# topics  主题及其展示顺序；子文件声明的主题不在此列表中会直接构建失败，
#         以免新条目被静默漏掉。新增分类在这里加一行即可，无需改代码。

[[topic_index]]
index = "english/analysis.md"
dir = "english/analysis"
title = "句子分析"
intro = "每条为一个句子的结构分析：引用为原句，下方列出解析要点。点击条目查看详情。\n\n下面按语法主题分组，便于按知识点检索；跨多个知识点的条目会在相关主题下重复出现。"
topics = [
  "倒装结构",
  "虚拟语气与条件句",
  "比较结构",
  "介词与固定搭配",
  "从句结构",
  "非谓语动词（分词 / 动名词 / 不定式 / 独立主格）",
  "情态与特殊句式",
  "疑问与修辞句",
  "动词短语与搭配",
]
