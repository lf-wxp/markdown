server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 统一以 UTF-8 输出，保证中文正文与中文文件名不乱码
    # 注意：charset_types 默认已包含 text/html，重复声明会触发
    #      "duplicate MIME type" 警告，故这里不再列出
    charset utf-8;
    charset_types text/css text/javascript application/javascript application/json;

    # 中文文件名（本站有 43 个）由浏览器百分号编码后请求，nginx 会自动解码
    log_not_found off;

    # ------------------------------------------------------------ MIME 说明
    # 不在此处使用 types 块：server 级别的 types 会**完全替换**全局 mime.types
    # 而非追加，会导致连 .html 都退化成 application/octet-stream，
    # 浏览器直接下载而不渲染。
    # Pagefind 的 .pf_index / .pf_fragment / .pf_meta 不在默认表中，
    # 会落到 default_type，正好就是我们需要的 application/octet-stream，
    # 因此无需额外声明。
    default_type application/octet-stream;

    # ------------------------------------------------------------ 压缩
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
    # 注意：不要 gzip pf_index / pf_fragment，它们已是压缩后的二进制，
    # 再压缩只增加 CPU 开销且体积不降

    # ------------------------------------------------------------ 缓存策略
    # HTML 每次校验，保证内容更新后立即可见
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Pagefind 索引文件名含内容哈希，可长期缓存
    location /_pagefind/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 搜索索引通过 fetch 加载，需允许同源访问
        try_files $uri =404;
    }

    # mdBook 的 css/js/字体也带哈希后缀
    location ~* \.(css|js|mjs|woff2?|ttf|svg|png|jpg|jpeg|ico|wasm)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # ------------------------------------------------------------ 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ------------------------------------------------------------ 路由
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # mdBook 生成了 404.html，用作找不到页面时的响应
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 不暴露 nginx 版本
    server_tokens off;
}
